<!doctype html><html><body style="background:#0B0F17;margin:0;padding:24px;display:flex;gap:24px;font-family:sans-serif;color:#fff">
<script>
const list=[['b1','48%','50%','18%'],['t1','48%','50%','18%'],['n1','48%','50%','20%'],['g1','46%','48%','18%'],['ng3','47%','50%','18%']];
const size=260;
document.body.innerHTML = list.map(([id,top,left,w])=>`
<div style="text-align:center">
  <div style="position:relative;width:${size}px;height:${size}px;background:#15151a;border-radius:16px;overflow:hidden">
    <img src="/src/assets/avatars/${id}.png" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"/>
    <span style="position:absolute;width:${w};aspect-ratio:1.58/1;left:${left};top:${top};transform:translate(-50%,-50%);display:block">
      <img src="/src/assets/adn-logo-mark.png" style="width:100%;height:100%;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 0 2px rgba(0,0,0,.9))"/>
    </span>
  </div>
  <div style="margin-top:8px">${id}</div>
</div>`).join('');
</script>
</body></html>
